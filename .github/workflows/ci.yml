name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  spa-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/app/admin-ui/spa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway/app/admin-ui/spa/package-lock.json
      - run: npm ci
      - run: npm run build

  run-ledger-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/app/run-ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: gateway/app/run-ledger/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest tests -v

# ponytail: covers only the two suites proven green locally (spa `tsc -b && vite build`,
# run-ledger's 28 tests). admin-ui/bff and config-sync-worker have tests/ dirs but no
# pytest pinned in their requirements -- add jobs for them once those are known to pass.
